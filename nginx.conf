# nginx.conf — Production reverse proxy for HRzest.com
# Place this at: /etc/nginx/sites-available/attendance
# Then: ln -s /etc/nginx/sites-available/attendance /etc/nginx/sites-enabled/
# And:  certbot --nginx -d yourdomain.com

# Hide the nginx version from the Server header (curl -I / scanners).
server_tokens off;

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL — managed by certbot (will auto-fill these lines)
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # Max upload size (face photos + documents)
    client_max_body_size 20M;

    # Security headers enforced at the edge — a backstop that doesn't
    # depend on the app's APP_ENV being set correctly. Long HSTS max-age
    # meets browser preload requirements (a short one would let the
    # protection lapse for infrequent visitors).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Proxy to Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Cache static assets for 7 days
    location /static/ {
        proxy_pass       http://127.0.0.1:5000/static/;
        expires          7d;
        add_header       Cache-Control "public, immutable";
    }

    # Health check — allow unauthenticated access for load balancer probes
    location /healthz {
        proxy_pass http://127.0.0.1:5000/healthz;
        access_log off;
    }
}
