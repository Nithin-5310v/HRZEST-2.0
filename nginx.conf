# nginx.conf — Production reverse proxy for HRzest.com
# Place this at: /etc/nginx/sites-available/attendance
# Then: ln -s /etc/nginx/sites-available/attendance /etc/nginx/sites-enabled/
# And:  certbot --nginx -d yourdomain.com

# Hide the nginx version from the Server header (curl -I / scanners).
server_tokens off;

# Gunicorn backend(s). A host running several Gunicorn processes (e.g. on
# 5001-5003) lists each one here; nginx round-robins between them and skips
# one that stops answering.
upstream hrzest_app {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# Rate limiting — defense-in-depth on top of Flask-Limiter. Files in
# sites-enabled/ are included inside http{}, which is where these zones must
# be declared. Unlike the container setup (nginx/nginx.conf.template), nginx
# here sees real client IPs, so the per-IP limits can be strict.
#   login:   credential/password-reset endpoints, 10 requests/min per IP
#   general: everything else, a generous flood backstop
limit_req_zone  $binary_remote_addr zone=hrzest_login:10m   rate=10r/m;
limit_req_zone  $binary_remote_addr zone=hrzest_general:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=hrzest_perip:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL — managed by certbot (will auto-fill these lines)
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # 256-bit AEAD only (no AES-128, no CBC, no static-RSA / DHE key exchange):
    # every TLS 1.2 suite is ECDHE + AES-256-GCM/SHA-384 or ChaCha20-Poly1305,
    # and TLS 1.3 is pinned to its two 256-bit suites below. Supported by every
    # browser and by Android 7+/iOS 11+ (the mobile app's floor).
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_conf_command    Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_ecdh_curve      X25519:secp384r1;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Max upload size (face photos + documents)
    client_max_body_size 20M;

    # Security headers enforced at the edge — a backstop that doesn't
    # depend on the app's APP_ENV being set correctly. Long HSTS max-age
    # meets browser preload requirements (a short one would let the
    # protection lapse for infrequent visitors).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    limit_conn hrzest_perip 20;

    # Login, OTP-verify and password-reset endpoints. burst=10 lets a person
    # load the form, mistype, and retry without hitting the limit; a
    # brute-force script gets 429s after that.
    location ~ ^/(login|admin_login|api/login|api/login/verify|api/employee/login|soc/login|super_admin/login|admin_forgot_password|employee_forgot_password)$ {
        limit_req          zone=hrzest_login burst=10 nodelay;
        proxy_pass         http://hrzest_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # Proxy to Gunicorn
    location / {
        limit_req          zone=hrzest_general burst=40 nodelay;
        proxy_pass         http://hrzest_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Uploaded HR documents are served only via the app's authenticated routes.
    location ^~ /static/employee_docs/   { return 404; }
    location ^~ /static/onboarding_docs/ { return 404; }

    # Cache static assets for 7 days
    location /static/ {
        proxy_pass       http://hrzest_app/static/;
        expires          7d;
        add_header       Cache-Control "public, immutable";
    }

    # Health check — allow unauthenticated access for load balancer probes
    location /healthz {
        proxy_pass http://hrzest_app/healthz;
        access_log off;
    }
}
