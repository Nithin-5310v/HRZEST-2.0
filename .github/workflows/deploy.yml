name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Syntax & structure check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies (for import checks)
        # dlib (pulled in transitively by face-recognition) ships no
        # prebuilt wheel at all (sdist only), so a bare `pip install -r
        # requirements.txt` compiles it from source here — 10-20+ min on
        # this runner's 2 cores, sometimes longer. dlib-bin is the same
        # `dlib` import, prebuilt as a wheel; installing face-recognition
        # --no-deps on top of it stops pip from also fetching the real
        # "dlib" package (name mismatch means pip can't tell dlib-bin
        # already satisfies it). The Containerfile's production build is
        # untouched — it deliberately compiles from source there.
        run: |
          pip install --no-cache-dir dlib-bin
          pip install --no-cache-dir --no-deps face-recognition face-recognition-models
          grep -v '^face-recognition' requirements.txt > /tmp/ci-requirements.txt
          pip install --no-cache-dir -r /tmp/ci-requirements.txt

      - name: Check Python syntax
        run: |
          for f in app.py wsgi.py extensions.py \
                   utils/auth.py utils/helpers.py utils/config.py \
                   utils/email_utils.py utils/attendance_utils.py; do
            python -m py_compile "$f" && echo "✅ $f" || (echo "❌ $f syntax error" && exit 1)
          done

      - name: Check key templates exist
        run: |
          for f in \
            templates/index.html \
            templates/admin.html \
            templates/employee_portal.html \
            templates/employees.html \
            templates/employee_detail.html \
            templates/settings.html \
            templates/salary_report.html \
            templates/leave_holidays.html \
            templates/onboarding.html; do
            [ -f "$f" ] && echo "✅ $f" || (echo "❌ $f missing" && exit 1)
          done

      - name: Check static assets exist
        run: |
          for f in static/shared.min.css static/darkmode.min.js static/jsQR.min.js; do
            [ -f "$f" ] && echo "✅ $f" || (echo "❌ $f missing" && exit 1)
          done

      - name: Check DevOps files exist
        run: |
          for f in Containerfile entrypoint.sh wsgi.py extensions.py \
                   compose.yaml compose.prod.yaml \
                   nginx/nginx.conf.template \
                   generate_cert.py init-letsencrypt.sh deploy.sh; do
            [ -f "$f" ] && echo "✅ $f" || (echo "❌ $f missing" && exit 1)
          done

      - name: Check utils package exists
        run: |
          for f in utils/__init__.py utils/auth.py utils/helpers.py \
                   utils/config.py utils/email_utils.py utils/attendance_utils.py; do
            [ -f "$f" ] && echo "✅ $f" || (echo "❌ $f missing" && exit 1)
          done

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Audit Python dependencies (pip-audit)
        # Scans requirements.txt/-dev.txt against the OSV vulnerability
        # database. Fails the build on any known CVE in a resolvable
        # version — bump the affected package's floor in requirements.txt
        # to fix, don't silence this check by adding to --ignore-vuln
        # without documenting why. (The former setuptools PYSEC-2026-3447
        # exception is gone: setuptools>=83 is now required -- see the
        # setuptools line in requirements.txt.)
        run: |
          pip install --no-cache-dir pip-audit
          python -m pip_audit -r requirements.txt -r requirements-dev.txt

      - name: Scan dependencies + secrets (Trivy)
        # Two things pip-audit alone doesn't cover: the mobile app's npm
        # dependencies (Trivy reads package-lock.json directly, no separate
        # npm-audit job needed), and hardcoded secrets anywhere in the
        # tracked tree (API keys, private keys, credential-shaped strings) —
        # nothing in this pipeline checked for that before. Gated to
        # HIGH/CRITICAL only per the severity floor we actually want to
        # block a PR on; ignore-unfixed skips CVEs with no available patch
        # yet, since failing the build on something nobody can act on today
        # just trains people to ignore red X's.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore

  sast:
    name: Static analysis (Bandit + Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required by github/codeql-action/upload-sarif below

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Run Bandit SAST
        # -ll: only report medium+ severity. -iii: only high-confidence
        # findings. Bandit's raw default output is noisy enough that a prior
        # manual run needed hand-verification of several findings before
        # trusting the severity labels — this filters to the subset worth
        # blocking a PR on, rather than training reviewers to click through
        # a wall of low-confidence noise.
        run: |
          pip install --no-cache-dir bandit
          bandit -r . -x ./tests,./venv,./mobile,./node_modules -ll -iii

      - name: Run Semgrep SAST
        # Bandit only understands Python — it can't see mobile/ (React
        # Native/TS) or the Jinja templates at all. Semgrep's OWASP
        # Top-10 + secrets + Flask/JS rulesets cover both, so it's a
        # genuinely additive gate rather than a second opinion on the same
        # code Bandit already checked. --severity ERROR --error means only
        # ERROR-severity findings produce a nonzero (build-blocking) exit;
        # WARNING/INFO findings still print to the job log but don't fail
        # the build, matching Bandit's own "-ll -iii" bar of only blocking
        # on high-confidence findings.
        run: |
          pip install --no-cache-dir semgrep
          semgrep scan \
            --config p/owasp-top-ten --config p/secrets --config p/flask --config p/javascript \
            --severity ERROR --error \
            --sarif --output semgrep.sarif \
            --exclude tests --exclude venv --exclude node_modules .

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  secrets-scan:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # TruffleHog needs full history to scan past commits, not just the current tree

      - name: Run TruffleHog
        # Distinct from the Trivy secret scan in the `security` job above —
        # Trivy there only scans the current checked-out tree; this walks
        # the full commit history (fetch-depth: 0), which is the only way
        # to catch a secret that was committed and later deleted/rotated
        # but still sits in git history. --only-verified suppresses the
        # "this looks like it could be a key" noise Bandit's own comment
        # above warns about, and only fails the build on a credential
        # TruffleHog actually confirmed is live against its issuing service.
        # --exclude-paths skips a venv/ folder that was accidentally
        # committed once (then removed) early in this repo's history —
        # vendored third-party package source/binaries in there produce
        # false-positive matches (e.g. cryptography's ssh.py legitimately
        # contains the literal string "BEGIN OPENSSH PRIVATE KEY" as a
        # parser constant), not actual project secrets.
        # Pinned to a specific release (not @main) so this security gate's
        # behavior can't change on us without a corresponding version bump
        # here. Do NOT add --fail to extra_args below -- the action's own
        # command template already appends --fail unconditionally before
        # extra_args, so including it here duplicates the flag; v3.95.9's
        # parser rejects that outright ("flag 'fail' cannot be repeated"),
        # which is what was actually failing this job, not a real secret.
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          extra_args: --only-verified --exclude-paths=.github/trufflehog-exclude.txt

  notify-security-failure:
    name: Alert security ops on gate failure
    runs-on: ubuntu-latest
    needs: [security, sast, secrets-scan]
    # This is a notification-only job — it never blocks anything itself.
    # The actual blocking already happens because `test`/`podman`/`deploy`
    # all transitively `needs:` these three jobs and GitHub Actions skips
    # (does not run) a job whose needs didn't all succeed. `if: failure()`
    # means this job only runs when at least one of them actually failed.
    if: failure()

    steps:
      - name: Post alert to security-ops channel
        # SECURITY_OPS_WEBHOOK_URL is a Slack/Discord/Teams incoming-webhook
        # URL, set as a repo/org secret — kept separate from the app's own
        # runtime SECURITY_ALERT_WEBHOOK_URL (utils/alerts.py) since a CI
        # gate failure and a production security event have different
        # on-call audiences and shouldn't share a channel by default.
        env:
          WEBHOOK_URL: ${{ secrets.SECURITY_OPS_WEBHOOK_URL }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # github.* values are interpolated by the Actions expression engine
        # into this script's literal text before bash ever parses it, so a
        # ref_name/actor containing shell metacharacters (possible on a
        # fork PR) could otherwise break out of the heredoc. Routing them
        # through env: + "$VAR" instead makes bash treat them as inert
        # string values via normal shell variable expansion.
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::SECURITY_OPS_WEBHOOK_URL not set — skipping alert (gate failure above still blocks the build)"
            exit 0
          fi
          curl -sf -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "text": "🛑 CI security gate FAILED — build blocked.\nRepo: $GH_REPOSITORY\nBranch: $GH_REF_NAME\nCommit: $GH_SHA\nTriggered by: $GH_ACTOR\nRun: $GH_RUN_URL"
          }
          EOF

  test:
    name: Pytest
    runs-on: ubuntu-latest
    needs: [lint, security, sast, secrets-scan]
    # The suite alone takes ~21 min on a hosted runner (ci-cd.yml's
    # uncovered run, 2026-10-07), before dependency install and coverage.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_testpass
          POSTGRES_DB: att_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d att_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        # See the lint job's "Install dependencies" step for why dlib-bin
        # is used here instead of letting pip compile the real dlib from
        # source (transitive dep of face-recognition, sdist only on PyPI).
        run: |
          pip install --no-cache-dir dlib-bin
          pip install --no-cache-dir --no-deps face-recognition face-recognition-models
          grep -v '^face-recognition' requirements.txt > /tmp/ci-requirements.txt
          pip install --no-cache-dir -r /tmp/ci-requirements.txt -r requirements-dev.txt

      - name: Run pytest
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: ci_testpass
          DB_NAME: att_test
          SECRET_KEY: ci-test-secret-key-not-used-in-prod
          FLASK_ENV: testing
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=40

  podman:
    name: Podman build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Podman image
        run: podman build -t attendance-app:ci .

      - name: Export image for scanning
        # trivy-action's image-ref mode asks Docker/containerd/Podman's
        # remote API for the image by name, but this runner has no live
        # daemon exposing any of them (Docker never saw an image podman
        # built; rootless Podman only exposes its API socket if
        # `podman system service` is explicitly started, which it isn't
        # here) -- every backend it tries fails and the scan never runs.
        # Saving to a tarball and pointing Trivy at the file directly
        # sidesteps needing any daemon/socket at all.
        run: podman save -o "${{ github.workspace }}/attendance-app-ci.tar" attendance-app:ci

      - name: Scan built image for OS-level vulnerabilities (Trivy)
        # The fs scan in the security job checks Python/npm dependency
        # manifests; it can't see CVEs in the base image's own OS packages
        # (the app image's own base, plus whatever's baked into
        # postgres:16 / nginx-unprivileged at deploy time).
        # This is the only step in the pipeline that actually looks inside
        # the built image.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ github.workspace }}/attendance-app-ci.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Verify image starts
        run: |
          podman run -d --name test-app \
            -e DB_HOST=localhost \
            -e DB_USER=test \
            -e DB_PASS=test \
            -e DB_NAME=test \
            -e SECRET_KEY=ci-test-key \
            attendance-app:ci || true
          sleep 5
          podman logs test-app 2>&1 | tail -20
          podman rm -f test-app || true

  publish:
    name: Publish signed image + SBOM
    runs-on: ubuntu-latest
    needs: podman
    # Only on a direct push to main, never for pull_request runs (no write
    # token / OIDC is issued to fork PRs anyway).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write      # push the image to GHCR
      id-token: write      # keyless cosign signing (GitHub OIDC -> Sigstore)
    outputs:
      image: ${{ steps.build.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push by digest
        id: build
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')/app"
          echo "${REGISTRY_TOKEN}" | podman login ghcr.io -u "${REGISTRY_USER}" --password-stdin
          podman build -t "${IMAGE}:${GITHUB_SHA}" .
          podman push "${IMAGE}:${GITHUB_SHA}" --digestfile digest.txt
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"

      - name: Sign the image (keyless)
        env:
          REF: ${{ steps.build.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REF}"

      - name: SBOM (CycloneDX) for the image
        # Trivy is already the pinned scanner in this pipeline; reusing it
        # avoids a second SBOM tool to keep current.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.build.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Attest the SBOM to the image
        env:
          REF: ${{ steps.build.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${REF}"

      - name: Keep the SBOM with the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: publish
    # Only on a direct push to main, never on pull_request runs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production   # requires approval from a repo admin before deploy runs

    steps:
      - name: Deploy the signed image by digest
        # SSH_USER must be the "attendance" user deploy.sh creates -- it runs
        # rootless Podman and owns /opt/employee-attendance directly, so no
        # sudo is needed (and it has none). Add the CI key to
        # /home/attendance/.ssh/authorized_keys on the instance.
        #
        # The host no longer builds anything: it checks out the exact commit
        # CI tested (compose/nginx files only) and runs the image CI built,
        # selected by digest and verified against its Sigstore signature
        # (scripts/deploy_verified_image.sh refuses an unsigned or
        # tag-addressed image).
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP_IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: APP_IMAGE,GIT_SHA
          script: |
            set -e
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            cd /opt/employee-attendance
            git fetch --quiet origin main
            git checkout --quiet --detach "$GIT_SHA"
            bash scripts/deploy_verified_image.sh
            echo "Deploy complete at $(date)"
