name: Total Automation CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------
  # Lint, Security & Unit Testing
  #
  # This used to also carry a "Build & Push to ECR" / "ECS Update" deploy
  # path (Docker build -> ECR -> ECS service update against
  # hrms-prod-cluster/hrms-prod-repo). Removed: those names matched no
  # Terraform-provisioned resource anywhere (not even the also-removed
  # ecs.tf, which used different names again), it built via `docker build
  # -f Dockerfile` even though this repo's actual container path is Podman
  # + Containerfile (see compose.yaml/deploy.sh/README's own "DevOps:
  # Podman, nginx, Let's Encrypt, GitHub Actions CI/CD, AWS EC2 + RDS +
  # Terraform" line -- no ECS/Fargate/ECR anywhere in it). The real
  # deployment is deploy.sh, run on the EC2 host itself. Every push to
  # main was very likely failing (or silently no-op'ing) at this stage.
  # ---------------------------------------------------------
  security-and-test:
    name: Code Quality & Security Scanning
    runs-on: ubuntu-latest
    env:
      # Only a true/false flag at job level, so the token itself stays
      # scoped to the Snyk step (a step's own env isn't visible to its if:).
      HAS_SNYK_TOKEN: ${{ secrets.SNYK_TOKEN != '' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_testpass
          POSTGRES_DB: att_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d att_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Dependencies
        run: |
          pip install --no-cache-dir dlib-bin
          pip install --no-cache-dir --no-deps face-recognition face-recognition-models
          grep -v '^face-recognition' requirements.txt > /tmp/ci-requirements.txt
          pip install --no-cache-dir -r /tmp/ci-requirements.txt -r requirements-dev.txt

      - name: Lint (flake8)
        run: python -m flake8 .

      - name: Dependency audit (pip-audit)
        # Blocks on any known vulnerability in a pinned dependency -- fix by
        # raising the package's floor in requirements.txt, not by ignoring.
        run: |
          pip install --no-cache-dir pip-audit
          python -m pip_audit -r requirements.txt -r requirements-dev.txt

      - name: Static analysis (Bandit, medium+ severity, high confidence)
        run: |
          pip install --no-cache-dir bandit
          bandit -r . -x ./tests,./venv,./.venv,./.venv_test,./mobile,./node_modules -ll -iii

      - name: Run Pytest
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: ci_testpass
          DB_NAME: att_test
          SECRET_KEY: ci-test-secret-key
          FLASK_ENV: testing
        run: python -m pytest tests/ -v

      - name: SAST Scan (Semgrep)
        # returntocorp/semgrep-action is archived; the CLI is the supported
        # path (same invocation deploy.yml's sast job uses).
        # Two p/default rules don't apply to this codebase and are excluded
        # by id, nothing else: sqlalchemy-execute-raw-query targets
        # SQLAlchemy, which HRZEST doesn't use (psycopg2 with %s parameters;
        # injection is covered by tainted-sql-string in deploy.yml's scan),
        # and python37-compatibility-importlib2 targets Python 3.7 (the
        # image runs 3.13).
        run: |
          pip install --no-cache-dir semgrep
          semgrep scan --config p/default --severity ERROR --error \
            --exclude-rule python.sqlalchemy.security.sqlalchemy-execute-raw-query.sqlalchemy-execute-raw-query \
            --exclude-rule python.lang.compatibility.python37.python37-compatibility-importlib2 \
            --exclude tests --exclude node_modules --exclude mobile .

      # Optional: runs only once a SNYK_TOKEN repository secret exists.
      # pip-audit above and Trivy in deploy.yml cover dependency CVEs meanwhile.
      - name: Dependency Scan (Snyk)
        if: env.HAS_SNYK_TOKEN == 'true'
        uses: snyk/actions/python-3.10@11b673cfb4b0dc0d860a1323caa199d54950dcce # master @ 2026-10-15
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test

      - name: Warn that Snyk was skipped
        if: env.HAS_SNYK_TOKEN != 'true'
        run: echo "::warning title=Snyk skipped::SNYK_TOKEN repository secret is not set, so the Snyk dependency scan did not run."
