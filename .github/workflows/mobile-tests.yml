name: Mobile app tests

# The app's jest suite (mobile/) never ran in CI: a change that broke it
# could reach develop, main and an over-the-air update unnoticed. Runs on
# every push and pull request that touches the app.
on:
  push:
    branches: ["main", "develop"]
    paths: ["mobile/**", ".github/workflows/mobile-tests.yml"]
  pull_request:
    branches: ["main", "develop"]
    paths: ["mobile/**", ".github/workflows/mobile-tests.yml"]

permissions:
  contents: read

jobs:
  jest:
    name: Mobile jest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # React Native 0.88 needs Node 22 for jest/metro.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        working-directory: mobile
        run: npm ci

      - name: Test
        working-directory: mobile
        run: node node_modules/jest/bin/jest.js --ci
