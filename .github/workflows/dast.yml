name: DAST (OWASP ZAP baseline)

# Weekly passive scan of the live site. STAGING_URL (a repository variable)
# is https://hrzest.com until a separate staging site exists; the owner chose
# production on 2026-11-19 because nothing else is reachable from GitHub.
# Baseline = spider + passive rules only: it reads pages and never sends
# attack payloads, so it can't trip the WAF auto-ban (utils/waf.py bans on
# SQLi/XSS-shaped requests) or change data.
# This repo is public, so findings are NOT filed as a GitHub issue; read them
# in the run's zap_scan artifact (kept 90 days, visible to signed-in users).
# A missing STAGING_URL fails the run instead of quietly passing.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require a scan URL
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          case "${STAGING_URL}" in
            https://*) echo "Scanning ${STAGING_URL}" ;;
            "") echo "::error title=DAST not configured::Set the STAGING_URL repository variable; the scan did not run."; exit 1 ;;
            *) echo "::error::STAGING_URL must be https://"; exit 1 ;;
          esac

      - name: ZAP baseline (passive, no attack payloads)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.STAGING_URL }}
          fail_action: false      # report only until the baseline is triaged
          allow_issue_writing: false
