name: Security & Code Quality CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  security_audit:
    name: Security & Code Quality Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"   # same as the image and the other workflows (QA CONFIG-02)

      - name: Install Audit Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Check Python Code Syntax
        run: |
          python -m py_compile app.py wsgi.py database.py extensions.py blueprints/*.py utils/*.py

      - name: Run Bandit Security Scanner
        run: |
          # Same floor as ci-cd.yml/deploy.yml (medium+ severity, high
          # confidence). The old `-s B101,B105` skipped one test id and
          # reported every LOW finding: all 15 B105 hits were false
          # positives on variable names containing "password"/"token", so
          # the skip was hiding nothing real -- but a gate that differs from
          # the other two is how real findings slip between them.
          bandit -r . -x ./tests,./venv,./.venv,./mobile,./node_modules -ll -iii
