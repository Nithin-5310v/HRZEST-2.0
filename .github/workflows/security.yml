name: Security & Code Quality CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security_audit:
    name: Security & Code Quality Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Audit Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Check Python Code Syntax
        run: |
          python -m py_compile app.py wsgi.py database.py extensions.py blueprints/*.py utils/*.py

      - name: Run Bandit Security Scanner
        run: |
          bandit -r blueprints/ utils/ -s B101,B105 || true
