version: 2
updates:
  # Python — requirements.txt / requirements-dev.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  # Mobile app — mobile/package.json
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "mobile"
    ignore:
      # Expo-managed packages are versioned in lockstep with the installed
      # Expo SDK (the `expo` entry in mobile/package.json). Bumping them one
      # PR at a time splits the app across SDKs: on 2026-10-14 this left
      # `expo` on 58 (still the `next` pre-release channel) and
      # react-native on 0.87 while 16 expo-* packages stayed on 57. Move the
      # SDK deliberately (`npx expo install expo@latest --fix`, then
      # `npx expo-doctor`); patch updates inside the current SDK still flow
      # through the ~ / exact ranges.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/metro-runtime"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/vector-icons"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The SDK pins these to one exact version (expo/bundledNativeModules.json),
      # and Expo Go ships that exact native build -- so even a patch bump breaks
      # the app in Expo Go. On 2026-10-23 patch PRs took react to 19.2.9,
      # reanimated to 4.5.5 and worklets to 0.10.4 against SDK 57's 19.2.3 /
      # 4.5.1 / 0.10.1, and Reanimated/Worklets refused to start ("Mismatch
      # between JavaScript part and native part"). No updates at all; they
      # move with the SDK via `npx expo install --fix`.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-webview"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-picker/picker"
      - dependency-name: "react-native-web"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-gesture-handler"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-screens"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@sentry/react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "babel-preset-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "metro-runtime"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/jest-preset"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@babel/core"
        # babel-preset-expo for the pinned SDK is tested against Babel 7.
        update-types: ["version-update:semver-major"]

  # GitHub Actions themselves (actions/checkout, actions/setup-python, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
