# /etc/nginx/conf.d/hrzest-hardening.conf on the EC2 host (installed by
# scripts/install_ec2_autodeploy.sh). Ubuntu's nginx.conf includes conf.d/*.conf
# inside its http {} block, so this applies to every site on the host.
#
# Send "Server: nginx" instead of "Server: nginx/1.24.0 (Ubuntu)" -- the
# version string helps an attacker pick known vulnerabilities (ZAP 10036,
# CWE-497). Also drops the version from nginx's own error pages. The repo's
# container nginx configs (nginx.conf, nginx/nginx.conf.template) already
# set this; the EC2 host runs Ubuntu's packaged nginx with its own config.
server_tokens off;
