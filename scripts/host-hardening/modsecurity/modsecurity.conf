# /etc/nginx/modsec/modsecurity.conf -- ModSecurity v3 engine settings.
# Based on ModSecurity's modsecurity.conf-recommended, with this app's limits.
# install_nginx_waf.sh sets the engine line from --engine (default On).

# On = block. DetectionOnly = log what would have been blocked, block nothing
# (re-run the installer with --engine DetectionOnly to fall back at once).
SecRuleEngine __ENGINE__

# ── request bodies ──
# Matches nginx's client_max_body_size (20m): an upload nginx accepts is
# inspected whole rather than half-parsed (a truncated multipart body fails
# strict parsing and would be refused). JSON bodies (face check-in frames,
# liveness captures) stay well under the no-files cap.
SecRequestBodyAccess On
SecRequestBodyLimit 20971520
SecRequestBodyNoFilesLimit 10485760
SecRequestBodyLimitAction Reject
SecRequestBodyJsonDepthLimit 512
SecArgumentsLimit 1000
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000

SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
    "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "^application/(?:[a-z0-9.-]+\+)?json" \
    "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQUEST_HEADERS:Content-Type "^application/csp-report" \
    "id:200006,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule &ARGS "@ge 1000" \
    "id:200007,phase:2,t:none,log,deny,status:400,msg:'Failed to fully parse request body due to large argument count',severity:2"
SecRule REQBODY_ERROR "!@eq 0" \
    "id:200002,phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}',severity:2"
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:200003,phase:2,t:none,log,deny,status:400,msg:'Multipart request body failed strict validation'"
SecRule MULTIPART_UNMATCHED_BOUNDARY "@eq 1" \
    "id:200004,phase:2,t:none,log,deny,msg:'Multipart parser detected a possible unmatched boundary.'"
SecRule TX:/^MSC_/ "!@streq 0" \
    "id:200005,phase:2,t:none,log,deny,msg:'ModSecurity internal error flagged: %{MATCHED_VAR_NAME}'"

# ── responses ──
# Off: the CRS data-leakage rules would read every payslip and HR page, and
# the app's own CSP / escaping is the control for what it sends.
SecResponseBodyAccess Off

# ── working files ──
SecTmpDir /var/cache/modsecurity/tmp
SecDataDir /var/cache/modsecurity/data
SecTmpSaveUploadedFiles Off
SecUploadKeepFiles Off

# ── audit log: one JSON object per refused or failed request ──
# Parts A (client address, time, method, URI), H (every rule that matched,
# with its id and message) and Z (end). Deliberately not B: in ModSecurity v3
# that part writes every request header, Cookie and Authorization included,
# and v3 cannot redact them -- verified on Ubuntu 24.04's libmodsecurity
# 3.0.12, where A alone already carries the method and URI. Never C/I (request
# body: passwords, PII, payroll) or E/F (the response). The firewall agent
# reads this file and sends the SOC the address, the rule ids and the path.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts AHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /var/log/nginx/modsec/audit.json

SecArgumentSeparator &
SecCookieFormat 0
# Shipped by Ubuntu's libnginx-mod-http-modsecurity package.
SecUnicodeMapFile /etc/nginx/unicode.mapping 20127
SecStatusEngine Off
