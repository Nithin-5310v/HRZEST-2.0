# /etc/nginx/modsec/hrzest-before-crs.conf -- this app's exclusions that must
# take effect before the CRS rules run (runtime ctl: actions, phase 1).
# Rule ids 1001000-1001999 are reserved for this file.
#
# Each exclusion is narrow (one path, one field or one rule) and says why.
# The app's own WAF (utils/waf.py) still inspects everything excluded here.
#
# Note for whoever edits this: libmodsecurity 3.0.12 (Ubuntu 24.04) does not
# accept regular expressions as ctl: targets (ARGS:/^x/), so every field is
# named explicitly. The photo block at the end is generated by
# scripts/host-hardening/modsecurity/gen_photo_exclusions.py.

# ── SOC console API ─────────────────────────────────────────────────────────
# Analysts search for attack strings (an SQLi payload as an event filter) and
# upload hostile logs for analysis. The console is network-allow-listed and
# signed in; the app exempts only signed-in calls from its own WAF. Here the
# CRS still evaluates and logs these requests, it just does not block them.
SecRule REQUEST_FILENAME "@beginsWith /socperson/api/" \
    "id:1001000,phase:1,pass,nolog,ctl:ruleEngine=DetectionOnly"

# ── firewall agent reports ──────────────────────────────────────────────────
# The host agent (scripts/firewall_agent) posts what the other layers refused,
# attackers' paths and rule messages included, so its JSON trips the very rules
# it reports on (seen: 921130 HTTP response splitting). Blocking it would blind
# the SOC Firewall view. The endpoint is HMAC-signed with FIREWALL_AGENT_SECRET
# and the app rejects an unsigned body before reading it. Still logged here.
SecRule REQUEST_FILENAME "@beginsWith /webhooks/firewall/" \
    "id:1001001,phase:1,pass,nolog,ctl:ruleEngine=DetectionOnly"

# ── credential fields ───────────────────────────────────────────────────────
# A password may legitimately be "' OR 1=1 --" or contain "<script>"; nothing
# but a hash function ever reads it. Never inspect password, PIN and one-time
# code fields, form-encoded (ARGS:x) or JSON (ARGS:json.x).
SecAction \
    "id:1001010,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:new_password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.new_password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:confirm_password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.confirm_password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:current_password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.current_password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:admin_password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.admin_password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:pin,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.pin,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:otp_code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.otp_code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:totp_code,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.totp_code"

# On the sign-in endpoints the account identifier too. The app answers an
# injection-shaped username exactly like a wrong password (app_setup/security.py,
# _WAF_EXEMPT_PATHS), so a prober learns nothing from the response; a 403 here
# would hand back exactly that signal. The identifier only ever reaches a bound
# query parameter.
SecRule REQUEST_FILENAME "@rx ^/(?:[a-z0-9][a-z0-9-]*/)?(?:login|admin_login|admin-login|employee_login|hr_login|api/(?:v1/)?login|api/(?:v1/)?employee/login|api/(?:v1/)?signin|super_admin/login|socperson/login)$" \
    "id:1001011,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:username,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.username,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:email,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.email,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:employee_id,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.employee_id,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:identifier,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.identifier"

# ── signed cookies ──────────────────────────────────────────────────────────
# The session cookie is a signed base64url blob, and random base64url text
# trips the SQL comment-sequence rule ("--") by chance. The app verifies the
# signature, so its content is not attacker-chosen in any useful way.
SecAction \
    "id:1001020,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:__Host-session,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:session,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:hrz_login_ok"

# ── passkeys ────────────────────────────────────────────────────────────────
# WebAuthn sends base64url values ('-' and '_' in random positions), which
# 942440 (SQL comment sequence) reads as "--" comments.
SecRule REQUEST_FILENAME "@rx /webauthn" \
    "id:1001030,phase:1,pass,nolog,ctl:ruleRemoveById=942440"

# ── photos sent as data: URIs ───────────────────────────────────────────────
# Check-in and profile photos arrive as "data:image/jpeg;base64,...". The
# prefix alone reads as an XSS attribute vector (941130, 941170), a PHP data
# scheme (934170) and a ";" command separator (932235, 932260) -- 25 points,
# every time. Excluded for these fields only (and the liveness frames the app
# reads), never by value: a value-based exclusion would let a request switch
# the rules off for its other fields by carrying one dummy image. The app
# decodes these as base64 and rejects anything else.
# Generated by gen_photo_exclusions.py -- edit that, not this block.
SecAction \
    "id:1001040,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=932235;ARGS:face_image,\
    ctl:ruleRemoveTargetById=932235;ARGS:face_photo,\
    ctl:ruleRemoveTargetById=932235;ARGS:photo,\
    ctl:ruleRemoveTargetById=932235;ARGS:json.face_image,\
    ctl:ruleRemoveTargetById=932235;ARGS:json.face_photo,\
    ctl:ruleRemoveTargetById=932235;ARGS:json.photo"
SecAction \
    "id:1001041,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=932260;ARGS:face_image,\
    ctl:ruleRemoveTargetById=932260;ARGS:face_photo,\
    ctl:ruleRemoveTargetById=932260;ARGS:photo,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.face_image,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.face_photo,\
