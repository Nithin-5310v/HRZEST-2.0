# /etc/nginx/modsec/crs-setup.conf -- OWASP CRS 4 settings for this app.
# Everything not set here keeps the CRS default (crs-setup.conf.example in the
# CRS release, kept beside the rules for reference).

# Anomaly scoring: each matching rule adds to a score and the request is
# refused once it reaches the threshold (5 = one critical match at
# paranoia level 1). Logged with every rule that contributed.
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# Paranoia level 1: the CRS's own production default, fewest false positives.
# Raise detection_paranoia_level first (logs, does not block) to see what a
# higher level would catch before raising the blocking level.
SecAction \
    "id:900000,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',ver:'OWASP_CRS/4.30.0',\
    setvar:tx.blocking_paranoia_level=1"

SecAction \
    "id:900110,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',ver:'OWASP_CRS/4.30.0',\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# Methods the app uses; nginx already returns 405 for the rest.
SecAction \
    "id:900200,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',ver:'OWASP_CRS/4.30.0',\
    setvar:'tx.allowed_methods=GET HEAD POST PUT PATCH DELETE OPTIONS'"

# Content types the app accepts: the CRS default list without the XML types
# (nothing in the app reads XML, so an XML body can only be an attack -- XXE
# and the like), plus browsers' CSP violation reports (/csp-report) and
# plain-text beacons.
SecAction \
    "id:900220,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',ver:'OWASP_CRS/4.30.0',\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |application/json| |application/csp-report| |application/reports+json| |text/plain|'"

SecAction \
    "id:900990,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',ver:'OWASP_CRS/4.30.0',\
    setvar:tx.crs_setup_version=4300"
