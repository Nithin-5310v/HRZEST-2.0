# /etc/nginx/modsec/main.conf -- the one file nginx loads
# (modsecurity_rules_file in the site config). Order matters: engine, CRS
# setup, exclusions that must run BEFORE the CRS rules, the rules, then
# exclusions that must run after them.
#
# hrzest-*.conf come from the repository (scripts/host-hardening/modsecurity/)
# and are replaced on every install. local-*.conf are this server's own
# urgent fixes: created empty once and never overwritten. Move anything that
# should last into the repository files.
Include /etc/nginx/modsec/modsecurity.conf
Include /etc/nginx/modsec/crs-setup.conf
Include /etc/nginx/modsec/hrzest-before-crs.conf
Include /etc/nginx/modsec/local-before-crs.conf
Include /etc/nginx/modsec/crs/rules/*.conf
Include /etc/nginx/modsec/hrzest-after-crs.conf
Include /etc/nginx/modsec/local-after-crs.conf
