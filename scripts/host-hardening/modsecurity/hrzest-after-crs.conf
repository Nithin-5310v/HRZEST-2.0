# /etc/nginx/modsec/hrzest-after-crs.conf -- exclusions that change CRS rules
# after they are defined (SecRuleRemoveById / SecRuleUpdateTargetById).
# Rule ids 1002000-1002999 are reserved for this file.
#
# How to add one, when a legitimate request is refused:
#   1. Find it: the SOC console's Firewall view (layer "Proxy WAF") or
#        sudo tail -n 50 /var/log/nginx/modsec/audit.json | jq '.transaction.messages[].details.ruleId'
#      Each refusal lists the rules that added to the score.
#   2. Exclude the narrowest thing that fixes it: one rule for one field on
#      one path, never a whole rule everywhere. For example, rich-text policy
#      documents posted to /policies/save tripping XSS rule 941160 on `body`:
#        SecRule REQUEST_FILENAME "@rx ^/(?:[a-z0-9][a-z0-9-]*/)?policies/save$" \
#            "id:1001100,phase:1,pass,nolog,ctl:ruleRemoveTargetById=941160;ARGS:body"
#      (a runtime rule like that one belongs in hrzest-before-crs.conf).
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# Empty on purpose until real traffic shows what this app needs.
