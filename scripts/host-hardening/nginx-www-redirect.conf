# Security review OBS-09 (2026-11): www.hrzest.com -> https://hrzest.com,
# 301, path and query kept. The live site file /etc/nginx/sites-available/hrzest
# isn't in this repo, so this is the block to paste into it.
# SECURITY_REMEDIATION.md (OBS-09) has the full steps, test and rollback.
#
# 1. In the existing `listen 443 ssl` server block, make it serve only the
#    canonical name:
#        server_name hrzest.com;
# 2. In the existing `listen 80` block, send everything straight to the
#    canonical HTTPS host (one hop instead of two for http://www...):
#        return 301 https://hrzest.com$request_uri;
# 3. Add this block next to them. The certificate already covers both names,
#    so the same certbot paths work here.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.hrzest.com;

    ssl_certificate     /etc/letsencrypt/live/hrzest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrzest.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # $request_uri is the original path + query string, unchanged.
    return 301 https://hrzest.com$request_uri;
}
# No security headers here on purpose: they're set once, by the app, and the
# browser only renders the hrzest.com response this redirects to. HSTS
# (includeSubDomains) from hrzest.com already covers www.
