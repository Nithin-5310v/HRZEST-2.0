# /etc/ssh/sshd_config.d/00-hrzest-ssh-hardening.conf on the EC2 host
# (security review OBS-05, 2026-11). Installed by
# scripts/host-hardening/install_ssh_hardening.sh; see SECURITY_REMEDIATION.md.
#
# Named 00-, not 99-: sshd keeps the FIRST value it reads for most settings,
# and Ubuntu's sshd_config includes sshd_config.d/*.conf in alphabetical
# order at the top. A 99- file would lose to EC2's 50-cloud-init.conf
# (which sets PasswordAuthentication), so its settings would silently not
# apply. Check what's in effect with:  sudo sshd -T | grep -Ei 'passw|macs|kex'

# Keys only, no root, the deploy user only.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers ubuntu

# Slow down guessing and drop half-open logins.
MaxAuthTries 3
LoginGraceTime 30

# Nothing but a shell.
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no

# Modern algorithms only: no SHA-1 MACs (the finding), no CBC, no DH group14.
# OpenSSH 9.6 on Ubuntu 24.04 supports every name below.
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256
PubkeyAcceptedAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256
