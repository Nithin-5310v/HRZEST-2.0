# /etc/fail2ban/filter.d/hrzest-nginx-auth.conf -- a failed API sign-in, from
# the site's JSON access log (log_format hzwaf_json, hrzest-waf-http.conf):
#   {"time":"2026-11-21T06:21:24+00:00","remote_addr":"203.0.113.5","method":"POST","uri":"/api/login","status":401,...}
# With or without a /<company>/ prefix. Not anchored at the start of the line:
# fail2ban removes the matched timestamp before it applies failregex.
[Definition]
failregex = "remote_addr":"<HOST>","method":"POST","uri":"/(?:[a-z0-9][a-z0-9-]*/)?(?:api/(?:v1/)?login(?:/verify)?|api/(?:v1/)?employee/login|api/(?:v1/)?signin|super_admin/login|socperson/login)(?:\?[^"]*)?","status":(?:401|403),
ignoreregex =
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S
