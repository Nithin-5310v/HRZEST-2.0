# /etc/fail2ban/filter.d/hrzest-modsec.conf -- a request ModSecurity refused,
# from nginx's error log:
#   2026/11/21 06:21:24 [error] 57#57: *3 [client 203.0.113.5] ModSecurity: Access denied with code 403 (phase 2). ...
[Definition]
failregex = ^\s*\[error\] \d+#\d+: \*\d+ \[client <HOST>\] ModSecurity: Access denied with code
ignoreregex =
datepattern = {^LN-BEG}%%Y/%%m/%%d %%H:%%M:%%S
