# /etc/fail2ban/filter.d/hrzest-nginx-limit.conf -- nginx refusing a request
# for exceeding one of the site's rate limits (zones hzwaf_*):
#   2026/11/21 06:21:25 [error] 57#57: *140 limiting requests, excess: 60.120 by zone "hzwaf_login", client: 203.0.113.5, server: hrzest.com, ...
[Definition]
failregex = ^\s*\[error\] \d+#\d+: \*\d+ limiting (?:requests|connections)(?:, excess: [\d.]+)? by zone "hzwaf_\w+", client: <HOST>,
ignoreregex =
datepattern = {^LN-BEG}%%Y/%%m/%%d %%H:%%M:%%S
