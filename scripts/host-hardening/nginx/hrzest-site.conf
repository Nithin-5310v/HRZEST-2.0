# /etc/nginx/sites-available/hrzest -- the production site (proxy firewall
# layer, docs/FIREWALL.md). Rendered and installed by
# scripts/host-hardening/install_nginx_waf.sh, which backs up the file it
# replaces, runs `nginx -t` and puts the old one back if the test fails.
#
# Placeholders the installer fills in: __DOMAIN__ (apex, e.g. hrzest.com),
# __UPSTREAM__ (gunicorn, e.g. 127.0.0.1:8000).
#
# What this layer does, in request order:
#   1. TLS 1.2/1.3, 256-bit AEAD only (snippets/hrzest-tls.conf)
#   2. method filter: GET HEAD POST PUT PATCH DELETE OPTIONS, anything else 405
#   3. size and time caps: 20 MB bodies, 8 KB header lines, slow-client
#      timeouts (slowloris)
#   4. per-client rate limits: login, payroll, everything else
#   5. ModSecurity v3 + OWASP CRS 4 (LTS) in blocking mode, with this app's
#      exclusions (/etc/nginx/modsec/)
#   6. proxy to gunicorn, which runs the app's own guards (IP/range bans, WAF
#      signatures, account lockout)
# Security headers stay the app's job (one source of truth, set once); nginx
# adds HSTS only to responses it makes itself (see hrzest-waf-http.conf).

upstream hzwaf_app {
    server __UPSTREAM__ max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# ── plain HTTP: ACME challenges, then one redirect to the canonical host ──
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    server_tokens off;
    modsecurity off;
    access_log /var/log/nginx/hrzest-access.json hzwaf_json;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }
    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

# ── https://www -> https://apex (OBS-09) ─────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;
    server_tokens off;
    modsecurity off;
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/nginx/snippets/hrzest-tls.conf;
    access_log /var/log/nginx/hrzest-access.json hzwaf_json;
    return 301 https://__DOMAIN__$request_uri;
}

# ── the app ─────────────────────────────────────────────────────────────
# default_server: a request with no SNI and the bare IP as Host (the AWS load
# balancer's health check, /healthz) is answered here, not by the www redirect.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/nginx/snippets/hrzest-tls.conf;

    # Real client address behind the AWS edge (empty in direct mode).
    include /etc/nginx/snippets/hrzest-realip.conf;

    access_log /var/log/nginx/hrzest-access.json hzwaf_json;
    error_log  /var/log/nginx/hrzest-error.log warn;

    # 2. methods. TRACE/CONNECT/WebDAV verbs never reach the app.
    if ($request_method !~ ^(?:GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # 3. caps and slow-client timeouts
    client_max_body_size        20m;
    client_body_buffer_size     256k;
    client_header_buffer_size   2k;
    large_client_header_buffers 4 8k;
    client_header_timeout       10s;
    client_body_timeout         20s;
    send_timeout                30s;
    keepalive_timeout           30s;
    keepalive_requests          1000;
    reset_timedout_connection   on;
    proxy_connect_timeout       10s;
    proxy_send_timeout          120s;
    proxy_read_timeout          120s;

    # 4. rate limits (zones: hrzest-waf-http.conf)
    limit_conn        hzwaf_conn 40;
    limit_req_status  429;
    limit_conn_status 429;

    # 5. ModSecurity + OWASP CRS
    modsecurity            on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    add_header Strict-Transport-Security $hzwaf_hsts always;

    location = /healthz {
        modsecurity off;
        access_log  off;
        include /etc/nginx/snippets/hrzest-proxy.conf;
    }

    # Uploaded HR documents are only served through the app's authenticated routes.
    location ^~ /static/employee_docs/   { return 404; }
    location ^~ /static/onboarding_docs/ { return 404; }

    location ^~ /static/ {
        modsecurity off;
        limit_req zone=hzwaf_general burst=200 nodelay;
        include /etc/nginx/snippets/hrzest-proxy.conf;
        expires 7d;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security $hzwaf_hsts always;
    }

    # Credential endpoints, with or without a /<company>/ prefix; every /api/x
    # route also answers as /api/v1/x (app.py, _register_api_v1_aliases).
    location ~ ^/(?:[a-z0-9][a-z0-9-]*/)?(?:login|admin_login|admin-login|employee_login|hr_login|mfa_verify|api/(?:v1/)?login|api/(?:v1/)?login/verify|api/(?:v1/)?employee/login|api/(?:v1/)?signin|super_admin/login|socperson/login|forgot_password|admin_forgot_password|employee_forgot_password|api/(?:v1/)?forgot_password)$ {
        limit_req zone=hzwaf_login burst=60 nodelay;
        include /etc/nginx/snippets/hrzest-proxy.conf;
        proxy_read_timeout 30s;
    }

    # Payroll: expensive reports and exports, and the data an attacker wants most.
    location ~ ^/(?:[a-z0-9][a-z0-9-]*/)?(?:api/(?:v1/)?payroll|api/(?:v1/)?hr_dashboard/payroll|lock_payroll|unlock_payroll|payroll_settings|salary) {
        limit_req zone=hzwaf_payroll burst=60 nodelay;
        include /etc/nginx/snippets/hrzest-proxy.conf;
    }

    location / {
        limit_req zone=hzwaf_general burst=80 nodelay;
        include /etc/nginx/snippets/hrzest-proxy.conf;
    }
}
