# /etc/nginx/snippets/hrzest-tls.conf -- TLS for every 443 server block.
# Same policy as nginx/nginx.conf.template: TLS 1.2/1.3, 256-bit AEAD only
# (ECDHE + AES-256-GCM / ChaCha20-Poly1305), X25519/P-384. Works for every
# browser and Android 7+ / iOS 11+, the mobile app's floor.
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_ciphers               ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_conf_command          Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
ssl_ecdh_curve            X25519:secp384r1;
ssl_prefer_server_ciphers on;
ssl_session_cache         shared:hzwaf_tls:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;
# OCSP stapling: install_nginx_waf.sh writes hrzest-ocsp.conf. It turns
# stapling on only when the certificate names an OCSP responder. Let's
# Encrypt stopped putting one in its certificates in 2025, so with a Let's
# Encrypt certificate there is nothing to staple and the file stays empty.
include /etc/nginx/snippets/hrzest-ocsp.conf;
