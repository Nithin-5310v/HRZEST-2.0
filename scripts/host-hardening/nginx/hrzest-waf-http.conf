# /etc/nginx/conf.d/hrzest-waf-http.conf -- http-context pieces of the proxy
# firewall layer (docs/FIREWALL.md). Installed by
# scripts/host-hardening/install_nginx_waf.sh; the server blocks are in
# hrzest-site.conf.
#
# Every name here is prefixed hzwaf_ so it cannot collide with a zone or map
# an older site file or /etc/nginx/nginx.conf already declares (nginx refuses
# to start on a duplicate). Directives that Ubuntu's nginx.conf already sets
# in the http block (timeouts, ssl_*) are set per server in the site file
# instead, for the same reason.

# Per-client rate limits. Customers often share one office or mobile-network
# address, so these are backstops sized for a shift-start rush; the app's
# account lockout and per-route limits are the precise ones.
limit_req_zone  $binary_remote_addr zone=hzwaf_login:10m   rate=60r/m;
limit_req_zone  $binary_remote_addr zone=hzwaf_payroll:10m rate=120r/m;
limit_req_zone  $binary_remote_addr zone=hzwaf_general:20m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=hzwaf_conn:10m;

# HSTS on responses nginx makes itself (a ModSecurity 403, a 429, a 502 while
# the app restarts). The app sends its own on everything it serves -- one
# source of truth, set once (app_setup/csrf_csp.py) -- so this is empty, and
# add_header sends nothing, whenever the upstream already sent one.
map $upstream_http_strict_transport_security $hzwaf_hsts {
    ""      "max-age=63072000; includeSubDomains; preload";
    default "";
}

# One JSON object per request: read by fail2ban (hrzest-nginx-auth jail) and
# kept for investigations. No cookies, no Authorization, no request body.
log_format hzwaf_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
    '"host":"$host","ua":"$http_user_agent","referer":"$http_referer","request_id":"$request_id",'
    '"upstream_status":"$upstream_status"}';
