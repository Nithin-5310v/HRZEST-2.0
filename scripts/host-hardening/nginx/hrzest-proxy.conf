# /etc/nginx/snippets/hrzest-proxy.conf -- how every app location proxies to
# gunicorn (hrzest.service, plain HTTP on loopback; nginx terminates TLS).
proxy_pass            http://hzwaf_app;
proxy_http_version    1.1;
proxy_set_header      Connection        "";
proxy_set_header      Host              $host;
proxy_set_header      X-Real-IP         $remote_addr;
# $remote_addr is the real client (behind the AWS edge too: see
# hrzest-realip.conf), appended last, which is what TRUSTED_PROXY_HOPS=1 reads.
proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header      X-Forwarded-Proto $scheme;
proxy_set_header      X-Request-ID      $request_id;
# Timeouts are set per server (hrzest-site.conf) so a location can override them.
# The app's response headers (Content-Security-Policy, preload Link, cookies)
# reach ~7 KB on the home page. nginx's default 4 KB proxy_buffer_size answers
# those with 502 "upstream sent too big header" (seen on hrzest.com 2026-11-23
# when this snippet first replaced the hand-made site file, which had 16k).
proxy_buffer_size       16k;
proxy_buffers           8 16k;
proxy_busy_buffers_size 32k;
