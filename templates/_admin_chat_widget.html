<!-- ═══ COMPANY <-> PLATFORM ADMIN CHAT (admin_base.html only) ═══
     Floating widget for the company admin/HR side of the one shared thread
     with the platform operator (utils/chat_utils.py). Polls rather than
     pushes -- consistent with this app's other real-time-ish UI (the
     dashboard's pollLiveStats in admin_base.html itself). -->
<button id="chatFab" onclick="chatToggle()"
        style="position:fixed;bottom:24px;right:24px;z-index:99997;width:56px;height:56px;border-radius:50%;border:none;
               background:linear-gradient(135deg,#1e3a8a,#3b82f6);color:#fff;font-size:22px;cursor:pointer;
               box-shadow:0 10px 25px rgba(30,58,138,0.4);display:flex;align-items:center;justify-content:center;">
  &#128172;
  <span id="chatUnreadBadge" style="display:none;position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;
        font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:10px;align-items:center;justify-content:center;padding:0 4px;"></span>
</button>

<div id="chatPanel" style="display:none;position:fixed;bottom:92px;right:24px;z-index:99997;width:340px;max-width:90vw;
     height:440px;max-height:70vh;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,0.25);
     display:none;flex-direction:column;overflow:hidden;font-family:'Segoe UI',sans-serif;">
  <div style="background:linear-gradient(135deg,#1e3a8a,#1a3a8f);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;">
    <div style="font-size:13px;font-weight:800;">Support Chat &middot; Platform Team</div>
    <button onclick="chatToggle()" style="border:none;background:rgba(255,255,255,0.15);color:#fff;width:24px;height:24px;border-radius:7px;cursor:pointer;">&#10005;</button>
  </div>
  <a href="mailto:admin@magzest.tech" style="display:block;padding:7px 16px;background:#eff6ff;color:#1e3a8a;
     font-size:11px;font-weight:600;text-decoration:none;border-bottom:1px solid #dbeafe;">
    &#9993;&nbsp; Prefer email? Send us a mail instead
  </a>
  <div id="chatMsgs" style="flex:1;overflow-y:auto;padding:12px;background:#f8fafc;display:flex;flex-direction:column;gap:8px;"></div>
  <form id="chatSendForm" style="display:flex;gap:8px;padding:10px;border-top:1px solid #e2e8f0;" onsubmit="return chatSend(event)">
    <input aria-label="Message the platform team…" id="chatInput" placeholder="Message the platform team&hellip;" autocomplete="off"
           style="flex:1;padding:9px 12px;border:1px solid #dbeafe;border-radius:20px;font-size:13px;outline:none;">
    <button type="submit" style="border:none;background:#1e3a8a;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;">&#10148;</button>
  </form>
</div>

<script>
(function() {
  var pollTimer = null;
  var isOpen = false;

  window.chatToggle = function() {
    isOpen = !isOpen;
    var panel = document.getElementById('chatPanel');
    panel.style.display = isOpen ? 'flex' : 'none';
    if (isOpen) {
      chatLoad();
      document.getElementById('chatUnreadBadge').style.display = 'none';
    }
  };

  function chatBubbleHtml(m) {
    var mine = (m.sender_kind === 'admin' || m.sender_kind === 'hr');
    return (
      '<div style="max-width:80%;align-self:' + (mine ? 'flex-end' : 'flex-start') + ';">' +
        '<div style="background:' + (mine ? '#1e3a8a' : '#e2e8f0') + ';color:' + (mine ? '#fff' : '#1e293b') +
          ';border-radius:14px;' + (mine ? 'border-bottom-right-radius:4px;' : 'border-bottom-left-radius:4px;') +
          'padding:8px 12px;font-size:13px;word-break:break-word;">' + chatEscape(m.message) + '</div>' +
        '<div style="font-size:10px;color:#94a3b8;margin-top:2px;' + (mine ? 'text-align:right;' : '') + '">' +
          chatEscape(m.sender_name) + '</div>' +
      '</div>'
    );
  }

  function chatEscape(s) {
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function chatLoad() {
    fetch('/api/admin/chat/messages').then(function(r) { return r.json(); }).then(function(data) {
      if (!data.ok) return;
      var box = document.getElementById('chatMsgs');
      box.innerHTML = data.messages.map(chatBubbleHtml).join('') ||
        '<div style="font-size:12px;color:#94a3b8;text-align:center;margin-top:20px;">No messages yet. Say hello!</div>';
      box.scrollTop = box.scrollHeight;
    }).catch(function() {});
  }

  window.chatSend = function(ev) {
    ev.preventDefault();
    var input = document.getElementById('chatInput');
    var text = input.value.trim();
    if (!text) return false;
    input.value = '';
    fetch('/api/admin/chat/send', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text}),
    }).then(function() { chatLoad(); }).catch(function() {});
    return false;
  };

  pollTimer = setInterval(function() {
    if (isOpen) { chatLoad(); }
  }, 8000);
})();
</script>
