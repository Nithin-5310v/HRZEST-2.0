<!-- ═══ COMPANY <-> PLATFORM ADMIN CHAT (admin_base.html only) ═══
     Floating widget for the company admin/HR side of the one shared thread
     with the platform operator (utils/chat_utils.py). Polls rather than
     pushes -- consistent with this app's other real-time-ish UI (the
     dashboard's pollLiveStats in admin_base.html itself). The thread itself
     is drawn by static/chat.js (styles: static/chat.css, linked in
     admin_base.html's <head>), shared with super_admin_dashboard.html. -->
<button id="chatFab" class="hz-chat-fab" onclick="chatToggle()" title="Chat with the platform team" aria-label="Chat with the platform team">
  <i class="ti ti-message-circle"></i>
  <span id="chatUnreadBadge" class="hz-chat-fab-badge"></span>
</button>

<div id="chatPanel" class="hz-chat hz-chat--company hz-chat-dock" role="dialog" aria-labelledby="chatPanelTitle">
  <div class="hz-chat-head">
    <div class="hz-chat-avatar" aria-hidden="true"><i class="ti ti-headset"></i></div>
    <div class="hz-chat-title">
      <div class="hz-chat-name" id="chatPanelTitle">Platform Team</div>
      <div class="hz-chat-sub">HRzest support</div>
    </div>
    <a class="hz-chat-icon-btn" href="mailto:admin@magzest.tech" title="Prefer email? admin@magzest.tech"
       aria-label="Email the platform team at admin@magzest.tech"><i class="ti ti-mail"></i></a>
    <button type="button" class="hz-chat-icon-btn" onclick="chatToggle()" title="Close" aria-label="Close chat"><i class="ti ti-x"></i></button>
  </div>
  <div id="chatMsgs" class="hz-chat-body" aria-live="polite"></div>
  <form id="chatSendForm" class="hz-chat-compose" onsubmit="return chatSend(event)">
    <textarea aria-label="Message the platform team" id="chatInput" rows="1" maxlength="2000"
              placeholder="Message the platform team&hellip;" autocomplete="off"></textarea>
    <button type="submit" class="hz-chat-send" title="Send" aria-label="Send message"><i class="ti ti-send"></i></button>
  </form>
</div>

<script src="{{ static_url('chat.js') }}"></script>
<script>
(function() {
  var pollTimer = null;
  var isOpen = false;
  var box = document.getElementById('chatMsgs');
  var input = document.getElementById('chatInput');
  HZChat.wireComposer(document.getElementById('chatSendForm'), input);

  window.chatToggle = function() {
    isOpen = !isOpen;
    document.getElementById('chatPanel').classList.toggle('hz-open', isOpen);
    if (isOpen) {
      chatLoad(true);
      input.focus();
      document.getElementById('chatUnreadBadge').style.display = 'none';
    }
  };

  function chatLoad(force) {
    fetch('/api/admin/chat/messages').then(function(r) { return r.json(); }).then(function(data) {
      if (!data.ok) return;
      HZChat.render(box, data.messages, {
        force: force === true,
        isMine: function(m) { return m.sender_kind === 'admin' || m.sender_kind === 'hr'; },
        seenByOther: function(m) { return m.read_by_platform; },
        emptyText: 'No messages yet. Say hello 👋',
      });
    }).catch(function() {});
  }

  window.chatSend = function(ev) {
    ev.preventDefault();
    var text = input.value.trim();
    if (!text) return false;
    HZChat.clearComposer(input);
    var pending = HZChat.addPending(box, text);
    fetch('/api/admin/chat/send', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text}),
    }).then(function(r) { return r.json(); }).then(function(data) {
      if (!data.ok) throw new Error(data.msg || 'not sent');
      pending.done();
      chatLoad(true);
    }).catch(function() {
      pending.fail();
      if (!input.value) input.value = text;       // never lose what was typed
    });
    return false;
  };

  pollTimer = setInterval(function() {
    if (isOpen) { chatLoad(); }
  }, 8000);
})();
</script>
