{% extends "admin_base.html" %}

{% block title %}Activity Log{% endblock %}

{% block page_css %}
  <style>
    .al-header {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
      background: #fff; border: 1px solid #e6e9ef; border-radius: 12px;
      padding: 18px 22px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(16,24,40,0.04);
    }
    .al-header h1 { font-size: 21px; font-weight: 700; letter-spacing: -.2px; display: flex; align-items: center; gap: 10px; margin: 0; }
    .al-header h1 i { color: #2563eb; }
    .al-header a { font-size: 14.5px; font-weight: 600; color: #2563eb; text-decoration: none; }
  </style>
{% endblock %}

{% block main %}
  <div class="al-header">
    <h1><i class="ti ti-history"></i> Activity Log</h1>
    <a href="{{ tpath('/admin_tools') }}?tab=activity_log"><i class="ti ti-tool"></i> Open in Admin Tools</a>
  </div>

  {% set al_url = tpath('/activity_log') %}
  {% set al_tab = '' %}
  {% include "_activity_log_panel.html" %}
{% endblock %}
