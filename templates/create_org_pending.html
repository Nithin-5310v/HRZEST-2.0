<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Submitted — HRzest Enterprise Platform</title>
  <link rel="icon" type="image/svg+xml" href="{{ static_url('favicon.svg') }}" />
  <link rel="stylesheet" href="{{ static_url('tabler-icons.min.css') }}" />
  <link rel="stylesheet" href="{{ static_url('shared.min.css') }}" />
  <link rel="stylesheet" href="{{ static_url('landing_v2.css') }}" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-body); }
    html, body { min-height: 100vh; color: var(--text-main); }
    body {
      background: linear-gradient(160deg, #FDF3E3 0%, #F7ECF7 28%, #EAF0FC 56%, var(--bg-secondary) 100%);
      background-attachment: fixed; display: flex; align-items: center; justify-content: center;
    }
    .card {
      max-width: 460px; margin: 24px; background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); padding: 40px 36px; box-shadow: var(--shadow-lg); text-align: center;
    }
    .icon {
      width: 60px; height: 60px; margin: 0 auto 20px; border-radius: 50%; background: rgba(5, 150, 105, 0.12);
      display: flex; align-items: center; justify-content: center; font-size: 30px; color: var(--accent-emerald);
    }
    h1 { font-family: var(--font-heading); font-size: 22px; font-weight: 800; margin-bottom: 12px; }
    p { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 8px; }
    .status-link { display: inline-block; margin-top: 18px; font-size: 13px; color: var(--accent-cyan); text-decoration: none; font-weight: 600; }
    .status-link:hover { text-decoration: underline; }
  </style>
  <!-- Shared Zoho-style public theme (blue, clean light canvas), loaded last -->
  <link rel="stylesheet" href="{{ static_url('public-theme.css') }}" />
  <!-- 3D motion & depth layer (static/ui-motion.*): loaded in <head>, no defer -->
  <link rel="stylesheet" href="{{ static_url('ui-motion.css') }}" />
  <script src="{{ static_url('ui-motion.js') }}"></script>
</head>
<body>
  <div class="card">
    <div class="icon"><i class="ti ti-clock-check"></i></div>
    <h1>Application Submitted</h1>
    <p>Thanks! Your company registration is now under review.</p>
    <p>Our team verifies every application's documents before activating a portal — you'll get an email as soon as a decision is made, usually within one business day.</p>
    <a class="status-link" href="/create_org/status/{{ application_id }}">Check your application status →</a>
  </div>
</body>
</html>
