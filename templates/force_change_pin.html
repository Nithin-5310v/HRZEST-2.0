<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set New Password — HRzest.com</title>
    <link rel="icon" type="image/svg+xml" href="{{ static_url('favicon.svg') }}" />
    <link rel="stylesheet" href="{{ static_url('tabler-icons.min.css') }}" />
    <link rel="stylesheet" href="{{ static_url('shared.min.css') }}" />
    <link rel="stylesheet" href="{{ static_url('landing_v2.css') }}" />
    <style>
      /* Same design system as templates/admin_login.html -- landing_v2.css's
         tokens -- so this reads as the same product, not a bolted-on page.
         Locked to light (data-theme="light", no darkmode.min.js) like
         admin_login.html/create_org.html: this is a forced, one-time
         security step, not a page a signed-in user's own theme preference
         should apply to.

         The one deliberate departure from admin_login.html's palette is the
         accent: amber instead of the brand indigo, on the icon badge, the
         "Action Required" notice (already amber) and the submit button --
         so this reads at a glance as a mandatory security action, not just
         another branded form, while every other token (background, card,
         spacing, type) stays identical to the rest of the app. */
      * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-body); }
      html, body { min-height: 100vh; color: var(--text-main); }
      body {
        background:
          linear-gradient(160deg, #FDF3E3 0%, #F7ECF7 28%, #EAF0FC 56%, var(--bg-secondary) 100%);
        background-attachment: fixed;
        display: flex; align-items: center; justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%; max-width: 420px;
        background: var(--bg-card);
        border: 1px solid var(--border-color); border-radius: var(--radius-lg);
        padding: 40px 36px 32px;
        box-shadow: var(--shadow-lg);
        position: relative; overflow: hidden;
      }
      .card::before {
        content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
        background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
      }

      .logo { text-align: center; margin-bottom: 28px; }
      .logo-icon {
        width: 44px; height: 44px; margin: 0 auto 14px;
        background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
        border-radius: var(--radius-sm);
        display: flex; align-items: center; justify-content: center;
        font-size: 19px; color: #fff;
        box-shadow: 0 6px 16px rgba(217, 119, 6, 0.3);
      }
      .logo h1 {
        font-family: var(--font-heading);
        font-size: 21px; font-weight: 800; letter-spacing: -0.3px;
        color: var(--text-main); margin-bottom: 6px;
      }
      .logo p { font-size: 13.5px; color: var(--text-muted); }

      .notice {
        display: flex; align-items: flex-start; gap: 10px;
        background: rgba(217, 119, 6, 0.08); border: 1px solid rgba(217, 119, 6, 0.25);
        border-radius: var(--radius-sm); padding: 13px 15px;
        font-size: 14.5px; color: #92400e; line-height: 1.5; margin-bottom: 22px;
      }
      .notice i { font-size: 19px; color: #D97706; flex-shrink: 0; margin-top: 1px; }
      .notice strong { display: block; color: #78350f; margin-bottom: 2px; }

      .field-group { margin-bottom: 18px; }
      .field-label {
        display: block;
        font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
        color: var(--text-muted); margin-bottom: 7px;
      }
      .field-input {
        width: 100%; padding: 12px 15px;
        background: var(--bg-secondary); border: 1px solid var(--border-color);
        border-radius: var(--radius-sm); color: var(--text-main); font-size: 16px; outline: none;
        transition: var(--transition-fast);
      }
      .field-input::placeholder { color: var(--text-subtle); }
      .field-input:focus {
        background: var(--bg-card); border-color: #D97706;
        box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.12);
      }
      .field-hint { font-size: 13.5px; color: var(--text-subtle); margin-top: 6px; margin-bottom: 0; line-height: 1.4; }

      .btn-submit {
        width: 100%; padding: 15px; border: none; border-radius: var(--radius-sm);
        background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
        color: #ffffff; font-size: 16.5px; font-weight: 700; letter-spacing: 0.2px;
        cursor: pointer; transition: var(--transition-fast); box-shadow: var(--shadow-md);
        margin-top: 4px;
        display: flex; align-items: center; justify-content: center; gap: 8px;
      }
      .btn-submit:hover { box-shadow: 0 10px 24px rgba(217, 119, 6, 0.35); transform: translateY(-1px); }
      .btn-submit:active { transform: translateY(0); }

      .alert-error {
        background: rgba(225, 29, 72, 0.08); border: 1px solid rgba(225, 29, 72, 0.25);
        border-radius: var(--radius-sm); padding: 13px 15px;
        color: var(--accent-rose); font-size: 15px; font-weight: 600; margin-bottom: 18px;
      }

      @media (max-width: 480px) { .card { padding: 32px 24px 28px; } }
    </style>
    <!-- Shared Zoho-style public theme (blue, clean light canvas), loaded last -->
  <link rel="stylesheet" href="{{ static_url('public-theme.css') }}" />
  <!-- 3D motion & depth layer (static/ui-motion.*): loaded in <head>, no defer -->
  <link rel="stylesheet" href="{{ static_url('ui-motion.css') }}" />
  <script src="{{ static_url('ui-motion.js') }}"></script>
</head>
  <body>
    <div class="card">
      <div class="logo">
        <div class="logo-icon"><i class="ti ti-shield-lock"></i></div>
        <h1>Set Your Password</h1>
        <p>Hi {{ emp_name }}, please set a new password to continue.</p>
      </div>

      <div class="notice">
        <i class="ti ti-alert-triangle"></i>
        <div>
          <strong>Action Required</strong>
          Your account is using a default or temporary password. You must set a new password before you can access the portal.
        </div>
      </div>

      {% if error %}
      <div class="alert-error">{{ error }}</div>
      {% endif %}

      <form method="POST">
        <div class="field-group">
          <label class="field-label">New Password</label>
          <input class="field-input" type="password" name="new_password" placeholder="Enter new password" required autofocus minlength="6" />
          <p class="field-hint">Minimum 6 characters. Do not use "1234".</p>
        </div>
        <div class="field-group">
          <label class="field-label">Confirm Password</label>
          <input class="field-input" type="password" name="confirm_password" placeholder="Re-enter new password" required minlength="6" />
        </div>
        <button type="submit" class="btn-submit"><i class="ti ti-device-floppy"></i> Save Password &amp; Continue</button>
      </form>
    </div>
  </body>
</html>
