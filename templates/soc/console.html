<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="dark light">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Security Operations</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/soc/assets/soc.css">
</head>
<body data-user="{{ username }}" data-role="{{ role }}" data-idle="{{ idle_seconds }}" data-loki="{{ 1 if loki else 0 }}">
  <a class="skip" href="#view">Skip to content</a>

  <aside class="side" id="side" aria-label="Sections">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8.2-8 9-4.8-.8-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
      <span>SOC</span>
    </div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="side-foot">
      <div class="who"><span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="who-text"><strong id="whoName"></strong><small id="whoRole"></small></span></div>
      <form method="post" action="/soc/logout">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn ghost small" id="logoutBtn">Sign out</button>
      </form>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="btn ghost icon" id="menuBtn" aria-label="Toggle menu" aria-controls="side" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 id="title">Overview</h1>
      <div class="threat" id="threat" role="status" aria-live="polite"></div>
      <div class="spacer"></div>
      <label class="sr" for="windowSel">Time window</label>
      <select id="windowSel" class="select">
        <option value="1">Last hour</option>
        <option value="6">Last 6 hours</option>
        <option value="24" selected>Last 24 hours</option>
        <option value="72">Last 3 days</option>
        <option value="168">Last 7 days</option>
        <option value="720">Last 30 days</option>
      </select>
      <button class="btn ghost icon" id="refreshBtn" aria-label="Refresh"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
      <button class="btn ghost icon" id="themeBtn" aria-label="Toggle light / dark theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="drawer" class="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="drawer-bar"><h2 id="drawerTitle"></h2><button class="btn ghost icon" id="drawerClose" aria-label="Close">×</button></div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>
  <div id="scrim" class="scrim" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="idleWarn" class="idle" hidden role="alert">Your session will end soon due to inactivity. <button class="btn small" id="idleStay">Stay signed in</button></div>

  <script src="/static/chart.umd.min.js"></script>
  <script src="/soc/assets/soc-core.js"></script>
  <script src="/soc/assets/soc-views.js"></script>
  <script src="/soc/assets/soc-analysis.js"></script>
</body>
</html>
