<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Admin</title>
  <link rel="icon" type="image/svg+xml" href="{{ static_url('favicon.svg') }}" />
  <link rel="stylesheet" href="{{ static_url('tabler-icons.min.css') }}" />
  <link rel="stylesheet" href="{{ static_url('shared.min.css') }}" />
  <link rel="stylesheet" href="{{ static_url('landing_v2.css') }}" />
  <link rel="stylesheet" href="{{ static_url('auth_split.css') }}" />
  <style>
    /* Same design system as templates/admin_login.html -- landing_v2.css's
       tokens so the whole auth flow reads as one product. Locked to light
       theme, same reasoning as admin_login.html. */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-body); }
    html, body { min-height: 100vh; color: var(--text-main); }
    body {
      background: linear-gradient(160deg, #FDF3E3 0%, #F7ECF7 28%, #EAF0FC 56%, var(--bg-secondary) 100%);
      background-attachment: fixed;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      padding: 40px 36px 32px;
      box-shadow: var(--shadow-lg);
      position: relative; overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: var(--gradient-brand);
    }
    /* block: landing_v2.css makes .logo a flex row (its nav logo) */
    .logo { display: block; text-align: center; margin-bottom: 28px; }
    .logo-icon {
      width: 60px; height: 60px; margin: 0 auto 16px;
      background: var(--gradient-brand);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; color: #fff;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.35);
    }
    .logo h1 { font-family: var(--font-heading); font-size: 21px; font-weight: 800; letter-spacing: -0.4px; color: var(--text-main); margin-bottom: 6px; }
    .logo p { font-size: 13px; color: var(--text-muted); }
    .field-group { margin-bottom: 20px; }
    .field-label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 7px; }
    .field-input {
      width: 100%; padding: 12px 15px;
      background: var(--bg-secondary); border: 1px solid var(--border-color);
      border-radius: var(--radius-sm); color: var(--text-main); font-size: 14px; outline: none;
      transition: var(--transition-fast);
    }
    .field-input::placeholder { color: var(--text-subtle); }
    .field-input:focus { background: var(--bg-card); border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12); }
    .btn-submit {
      width: 100%; padding: 15px; border: none; border-radius: var(--radius-sm);
      background: var(--gradient-brand); color: #fff; font-size: 14.5px; font-weight: 700;
      cursor: pointer; transition: var(--transition-fast); box-shadow: var(--shadow-md);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-submit:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
    .alert { padding: 13px 15px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .alert-error { background: rgba(225, 29, 72, 0.08); border: 1px solid rgba(225, 29, 72, 0.25); color: var(--accent-rose); }
    .alert-success { background: rgba(5, 150, 105, 0.08); border: 1px solid rgba(5, 150, 105, 0.25); color: var(--accent-emerald); }
    .links { margin-top: 22px; text-align: center; font-size: 12.5px; }
    .links a { color: var(--accent-cyan); font-weight: 600; text-decoration: none; }
    .links a:hover { color: var(--accent-blue); }
    @media (max-width: 480px) { .card { padding: 32px 24px 28px; } }
  </style>
</head>
<body>
  <main class="auth-split">
  {% include "_auth_promo.html" %}
  <div class="card">
    <div class="logo">
      <div class="logo-icon"><i class="ti ti-lock-question"></i></div>
      <h1>Forgot Password?</h1>
      <p>Enter the admin email address to receive a reset link.</p>
    </div>

    {% if sent %}
      <div class="alert alert-success"><i class="ti ti-circle-check"></i> Reset link sent! Check your email inbox. The link expires in 1 hour.</div>
    {% else %}
      {% if error %}
        <div class="alert alert-error"><i class="ti ti-alert-circle"></i> {{ error }}</div>
      {% endif %}
      <form method="POST">
        <div class="field-group">
          <label class="field-label" for="admin_email">Admin Email Address</label>
          <input class="field-input" type="email" id="admin_email" name="email" placeholder="admin@example.com" required autofocus />
        </div>
        <button type="submit" class="btn-submit"><span>Send Reset Link</span> <i class="ti ti-arrow-right"></i></button>
      </form>
    {% endif %}

    <div class="links"><a href="{{ tpath('/login') }}">← Back to Login</a></div>
  </div>
  </main>
</body>
</html>
