    <style>
      #empTable tbody tr.row-new td { background: #dcfce7; transition: background 1s ease; }
      * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", sans-serif; }
      body { background: #eff6ff; min-height: 100vh; display: flex; }

      /* SIDEBAR */
      .sidebar {
        width: 240px; height: 100vh; position: sticky; top: 0; overflow-y: auto;
        background: linear-gradient(180deg, #0f2460 0%, #1a3a8f 100%);
        padding: 22px 14px; color: white;
        display: flex; flex-direction: column; flex-shrink: 0;
        box-shadow: 4px 0 20px rgba(0,0,0,0.18);
      }
      .brand-wrap { display: flex; align-items: center; gap: 11px; margin-bottom: 28px; padding: 0 4px; }
      .brand     { font-size: 17px; font-weight: 800; color: #fff; line-height: 1.2; }
      .brand-sub { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 2px; }
      .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin: 1px 0; color: rgba(255,255,255,0.75); text-decoration: none; border-radius: 10px; font-size: 15px; font-weight: 500; transition: 0.18s; position: relative; }
      .nav-item:hover  { background: rgba(255,255,255,0.1); color: #fff; }
      .nav-item.active { background: rgba(255,255,255,0.15); color: #fff; font-weight: 700; }
      .nav-item.active::before { content: ''; position: absolute; left: 0; top: 20%; bottom: 20%; width: 3px; border-radius: 2px; background: #60a5fa; }
      .nav-item.active .nav-icon { background: rgba(96,165,250,0.2); }
      .nav-item:hover .nav-icon  { background: rgba(255,255,255,0.12); }
      .nav-sep { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 8px 0; }
      .badge-count { margin-left: auto; background: #ef4444; color: white; border-radius: 20px; padding: 1px 7px; font-size: 12px; font-weight: 700; }
      .sidebar-footer { margin-top: auto; font-size: 13px; color: rgba(255,255,255,0.4); padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 7px; }

      /* MAIN */
      .main { flex: 1; padding: 28px; min-width: 0; overflow-x: hidden; }
      .page-header { margin-bottom: 20px; }
      .page-header h1 { font-size: 26px; color: #1e293b; display: flex; align-items: center; gap: 10px; }
      .page-header p  { font-size: 15px; color: #64748b; margin-top: 4px; }

      /* FLASH */
      .flash-list { list-style: none; margin-bottom: 14px; }
      .flash-msg  { padding: 10px 14px; border-radius: 9px; font-size: 15px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
      .flash-success { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
      .flash-error   { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }

      /* STAT CARDS */
      .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
      .stat-card { background: #fff; border: 1px solid #dbeafe; border-radius: 14px; padding: 18px 20px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: 0.18s; }
      .stat-card:hover { border-color: #93c5fd; box-shadow: 0 4px 16px rgba(30,58,138,0.08); }
      .stat-card.active-filter { border-color: #3b82f6; box-shadow: 0 0 0 2px #bfdbfe; }
      .stat-icon { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
      .stat-icon.total    { background: #dbeafe; color: #1d4ed8; }
      .stat-icon.active   { background: #dcfce7; color: #16a34a; }
      .stat-icon.onleave  { background: #fef9c3; color: #b45309; }
      .stat-icon.resigned { background: #fee2e2; color: #dc2626; }
      .stat-val { font-size: 28px; font-weight: 800; color: #1e293b; line-height: 1; }
      .stat-lbl { font-size: 14px; color: #64748b; margin-top: 2px; font-weight: 600; }

      /* TOOLBAR */
      .toolbar { background: #fff; border: 1px solid #dbeafe; border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; }
      .toolbar-row1 { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
      .toolbar-row2 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .search-wrap { flex: 1; min-width: 200px; position: relative; }
      .search-wrap i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 18px; pointer-events: none; }
      .search-box { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid #dbeafe; border-radius: 10px; background: #f8fafc; color: #1e293b; font-size: 15px; outline: none; transition: 0.2s; }
      .search-box:focus { border-color: #93c5fd; background: #fff; }
      .emp-count { font-size: 15px; color: #64748b; white-space: nowrap; font-weight: 600; }
      .btn-add { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border: none; border-radius: 8px; background: #1e3a8a; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; white-space: nowrap; }
      .btn-add:hover { background: #1e40af; }
      .filter-label { font-size: 13px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
      .filter-select { padding: 8px 10px; border: 1px solid #dbeafe; border-radius: 9px; background: #f8fafc; color: #1e293b; font-size: 14px; outline: none; cursor: pointer; min-width: 120px; }
      .filter-select:focus { border-color: #93c5fd; }
      .btn-clear-filter { padding: 8px 12px; border: 1px solid #fee2e2; border-radius: 9px; background: #fff; color: #dc2626; font-size: 14px; font-weight: 600; cursor: pointer; display: none; align-items: center; gap: 5px; }
      .btn-clear-filter:hover { background: #fee2e2; }
      /* DEPT TABS */
      .dept-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
      .dept-tab { padding: 7px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid #dbeafe; background: #f8fafc; color: #475569; transition: .18s; }
      .dept-tab:hover { background: #eff6ff; border-color: #93c5fd; color: #1e3a8a; }
      .dept-tab.active { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
      .dept-tab.all-tab.active { background: #1e3a8a; }
      /* dept group header in table */
      .dept-group-row td { background: #eff6ff; color: #1e3a8a; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; padding: 6px 14px; border-bottom: 1px solid #dbeafe; }
      /* autocomplete datalist styling handled by browser */

      /* TABLE */
      .section { background: #fff; border: 1px solid #dbeafe; border-radius: 16px; padding: 0; overflow: hidden; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 15px; }
      th { background: #dbeafe; color: #1e3a8a; padding: 11px 14px; text-align: left; font-weight: 700; white-space: nowrap; font-size: 14px; }
      td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; white-space: nowrap; color: #1e293b; vertical-align: middle; }
      tr:last-child td { border-bottom: none; }
      tr:hover td { background: #f8faff; }
      .empty-cell { text-align: center; padding: 40px; color: #94a3b8; }
      .muted { color: #94a3b8; }

      /* AVATAR */
      .avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid #dbeafe; }
      .avatar-ph { width: 34px; height: 34px; border-radius: 50%; background: #e2e8f0; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 14px; border: 2px solid #dbeafe; }
      /* .avatar-ph's own display:flex above and the sitewide .u-d-none
         utility are both single-class selectors -- same specificity, so
         whichever loads later in the cascade wins. This rule's two-class
         selector outranks both, so the placeholder actually stays hidden
         behind a loaded photo instead of rendering next to it. */
      .avatar-ph.u-d-none { display: none; }
      .avatar-btn { background: none; border: none; padding: 0; cursor: pointer; position: relative; display: inline-flex; border-radius: 50%; }
      .avatar-btn:hover .avatar { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.3); }
      .avatar-eye { position: absolute; inset: 0; border-radius: 50%; background: rgba(30,58,138,0.55); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.18s; font-size: 13px; color: #fff; pointer-events: none; }
      .avatar-btn:hover .avatar-eye { opacity: 1; }

      /* PHOTO LIGHTBOX */
      .lb-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
      .lb-backdrop.open { display: flex; }
      .lb-box { background: #1e293b; border-radius: 20px; overflow: hidden; width: 100%; max-width: 400px; box-shadow: 0 24px 80px rgba(0,0,0,0.6); position: relative; }
      .lb-img-wrap { width: 100%; aspect-ratio: 1/1; background: #0f172a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      .lb-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .lb-placeholder { font-size: 72px; }
      .lb-info { padding: 16px 20px 18px; }
      .lb-name { font-size: 19px; font-weight: 800; color: #fff; }
      .lb-id   { font-size: 14px; color: rgba(255,255,255,0.45); margin-bottom: 14px; }
      .lb-actions { display: flex; gap: 8px; }
      .lb-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: 9px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; text-decoration: none; transition: 0.18s; }
      .lb-btn-dl   { background: #22c55e; color: #fff; flex: 1; justify-content: center; }
      .lb-btn-dl:hover { background: #16a34a; }
      .lb-btn-edit { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.18); }
      .lb-btn-edit:hover { background: rgba(255,255,255,0.22); }
      .lb-close { position: absolute; top: 10px; right: 12px; background: rgba(0,0,0,0.5); border: none; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; cursor: pointer; z-index: 1; }

      /* BADGES */
      .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 13px; font-weight: 700; }
      .badge-role   { background: #dbeafe; color: #1d4ed8; }
      .badge-green  { background: #dcfce7; color: #15803d; }
      .status-active   { background: #dcfce7; color: #16a34a; border: 1px solid #86efac; }
      .status-onleave  { background: #fef9c3; color: #92400e; border: 1px solid #fde68a; }
      .status-resigned { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }

      /* ACTION BUTTONS */
      .actions-cell { display: flex; align-items: center; gap: 4px; }
      .btn-icon { padding: 5px 9px; border: none; border-radius: 7px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.18s; display: flex; align-items: center; gap: 3px; white-space: nowrap; }
      .btn-edit  { background: #dbeafe; color: #1d4ed8; }
      .btn-edit:hover { background: #bfdbfe; }
      .btn-del   { background: #fee2e2; color: #dc2626; }
      .btn-del:hover { background: #fecaca; }
      .btn-qr    { background: #f3e8ff; color: #7c3aed; }
      .btn-qr:hover { background: #ede9fe; }
      .btn-photo { background: #fef9c3; color: #92400e; }
      .btn-photo:hover { background: #fef08a; }
      .btn-idcard { background: #d1fae5; color: #065f46; }
      .btn-idcard:hover { background: #a7f3d0; }

      /* MODALS */
      .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 1000; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
      .modal-backdrop.open { display: flex; }
      .modal-box { background: #fff; border: 1px solid #dbeafe; border-radius: 20px; padding: 26px 26px 22px; width: 100%; max-width: 640px; box-shadow: 0 20px 60px rgba(30,58,138,0.15); position: relative; margin: auto; }
      .modal-box h3 { font-size: 19px; color: #1e293b; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
      .modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none; font-size: 24px; color: #94a3b8; cursor: pointer; line-height: 1; }
      .modal-close:hover { color: #1e293b; }

      /* EDIT MODAL TABS */
      .tab-bar { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 2px solid #dbeafe; padding-bottom: 0; }
      .tab-btn { padding: 8px 14px; border: none; border-radius: 8px 8px 0 0; background: none; color: #64748b; font-size: 14px; font-weight: 700; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: 0.15s; }
      .tab-btn.active { color: #1e3a8a; border-bottom-color: #1e3a8a; background: #eff6ff; }
      .tab-btn:hover:not(.active) { background: #f1f5f9; color: #334155; }
      .tab-pane { display: none; }
      .tab-pane.active { display: block; }

      /* FORM GRID */
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .form-grid .full { grid-column: 1 / -1; }
      .field-group label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; margin-bottom: 4px; }
      .field-group input,
      .field-group select,
      .field-group textarea { width: 100%; padding: 9px 11px; border: 1px solid #dbeafe; border-radius: 9px; background: #f8fafc; color: #1e293b; font-size: 15px; outline: none; transition: 0.2s; font-family: inherit; }
      .field-group textarea { resize: vertical; min-height: 64px; }
      .field-group input:disabled { background: #f1f5f9; color: #94a3b8; }
      .field-group input:focus,
      .field-group select:focus,
      .field-group textarea:focus { border-color: #93c5fd; background: #fff; }
      .sec-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #64748b; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; margin: 4px 0 10px; grid-column: 1 / -1; }
      .form-sub-section { border: 1px solid #e2e8f0; border-radius: 10px; margin-top: 10px; overflow: hidden; }
      .form-sub-header { padding: 10px 14px; background: #f8fafc; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; color: #374151; transition: 0.15s; user-select: none; }
      .form-sub-header:hover { background: #eff6ff; color: #1e3a8a; }
      .form-sub-header i { transition: transform 0.2s; font-size: 16px; }
      .form-sub-body { padding: 14px 14px 2px; }
      .radio-group { display: flex; gap: 14px; flex-wrap: wrap; }
      .radio-label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 15px; font-weight: 600; color: #334155; }
      .location-box { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 10px; padding: 12px; grid-column: 1 / -1; }
      .location-box-title { font-size: 13px; font-weight: 700; color: #0369a1; margin-bottom: 8px; }
      .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
      .btn-save { flex: 1; padding: 7px; border: none; border-radius: 8px; background: #1e3a8a; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
      .btn-save:hover { background: #1e40af; }
      .btn-cancel { flex: 1; padding: 11px; border: 1px solid #dbeafe; border-radius: 10px; background: #f8fafc; color: #475569; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
      .btn-cancel:hover { background: #e2e8f0; }

      /* PHOTO / QR MODALS */
      .photo-upload-box { border: 2px dashed #bfdbfe; border-radius: 12px; padding: 18px; text-align: center; cursor: pointer; transition: 0.2s; background: #f8fafc; }
      .photo-upload-box:hover { border-color: #60a5fa; background: #eff6ff; }
      .photo-upload-box input[type=file] { display: none; }
      .photo-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 8px auto 0; display: block; border: 3px solid #dbeafe; }
      .qr-modal-box { text-align: center; max-width: 320px; }
      .qr-modal-box img { width: 200px; height: 200px; border-radius: 12px; padding: 8px; border: 1px solid #dbeafe; margin: 0 auto 14px; display: block; }
      .btn-download { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; background: #1e3a8a; color: #fff; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 700; transition: 0.2s; }
      .btn-download:hover { background: #1e40af; }
      .btn-regen { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; background: #f3e8ff; color: #7c3aed; border: 1px solid #ddd6fe; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px; }
      .btn-regen:hover { background: #ede9fe; }

      @keyframes fpRegPulse {
        0%,100% { transform: scale(1); opacity: 0.75; }
        50%      { transform: scale(1.12); opacity: 1; }
      }

      .table-scroll-hint {
        display: none; padding: 8px 14px 0; font-size: 13px; color: #94a3b8;
        text-align: right;
      }

      @media (max-width: 900px) {
        .stat-row { grid-template-columns: repeat(2, 1fr); }
      }
      @media (max-width: 768px) {
        body { flex-direction: column; }
        .sidebar { width: 100%; height: auto; position: static; flex-direction: row; flex-wrap: wrap; padding: 10px; }
        .sidebar .brand, .sidebar .brand-sub, .sidebar-footer { display: none; }
        .nav-sep { display: none; }
        .form-grid { grid-template-columns: 1fr; }
        .form-grid .full, .sec-title, .location-box { grid-column: 1; }
        .stat-row { grid-template-columns: repeat(2, 1fr); }
        .main { padding: 16px; }
        /* Employee table on a phone: 13-14 columns doesn't fit any screen,
           but showing only 4-5 with no hint that it scrolled was silently
           cutting the row off mid-column (Photo/Employee ID/Name, nothing
           past that) -- narrowed to the columns someone actually needs at
           a glance (ID, Name, Status, Actions) and added an explicit
           swipe hint for the rest, rather than leaving both problems for
           the user to discover by accident. */
        .col-mobile-hide { display: none; }
        .table-scroll-hint { display: block; }
      }

      /* ── PAGINATION ── */
      .pagination-bar {
        display: flex; align-items: center; justify-content: space-between;
        flex-wrap: wrap; gap: 10px; padding: 12px 4px 0;
      }
      .page-info { font-size: 15px; color: #64748b; }
      .page-btns { display: flex; gap: 6px; align-items: center; }
      .btn-page {
        padding: 5px 14px; border-radius: 7px; border: 1px solid #dbeafe;
        background: #fff; color: #1e3a8a; font-size: 15px; font-weight: 600; cursor: pointer;
        transition: 0.15s;
      }
      .btn-page:hover:not(:disabled) { background: #dbeafe; }
      .btn-page:disabled { opacity: 0.4; cursor: default; }
      .btn-page.active { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }

      /* ── Dark mode ── */
      body.dark-mode { background: #0d1117 !important; }
      body.dark-mode .main { background: #0d1117 !important; color: #cdd9e5 !important; }
      body.dark-mode .page-header h1 { color: #cdd9e5 !important; }
      body.dark-mode .page-header p { color: #768390 !important; }
      body.dark-mode .stat-card { background: #161b22 !important; border-color: #30363d !important; }
      body.dark-mode .stat-val { color: #cdd9e5 !important; }
      body.dark-mode .stat-lbl { color: #768390 !important; }
      body.dark-mode .stat-icon.total { background: #1e3a8a !important; }
      body.dark-mode .stat-icon.active { background: #14532d !important; }
      body.dark-mode .stat-icon.onleave { background: #713f12 !important; }
      body.dark-mode .stat-icon.resigned { background: #7f1d1d !important; }
      body.dark-mode .toolbar { background: #161b22 !important; border-color: #30363d !important; }
      body.dark-mode .search-box { background: #0d1117 !important; border-color: #30363d !important; color: #cdd9e5 !important; }
      body.dark-mode .filter-label { color: #768390 !important; }
      body.dark-mode .filter-select { background: #0d1117 !important; border-color: #30363d !important; color: #cdd9e5 !important; }
      body.dark-mode .dept-tab { background: #1c2128 !important; border-color: #30363d !important; color: #94a3b8 !important; }
      body.dark-mode .dept-tab.active { background: #1e3a8a !important; color: #93c5fd !important; border-color: #1e3a8a !important; }
      body.dark-mode .dept-group-row td { background: #0f1f3d !important; color: #93c5fd !important; border-color: #1e3a8a !important; }
      body.dark-mode .section { background: #161b22 !important; border-color: #30363d !important; }
      body.dark-mode .avatar-ph { background: #30363d !important; color: #768390 !important; border-color: #30363d !important; }
      body.dark-mode .modal-box { background: #161b22 !important; border-color: #30363d !important; }
      body.dark-mode .modal-box h3 { color: #cdd9e5 !important; }
      body.dark-mode .btn-page { background: #1c2128 !important; border-color: #30363d !important; color: #94a3b8 !important; }
      body.dark-mode .btn-page.active { background: #1e3a8a !important; color: #93c5fd !important; border-color: #1e3a8a !important; }
      body.dark-mode .flash-success { background: #14532d !important; border-color: #166534 !important; color: #4ade80 !important; }
      body.dark-mode .flash-error { background: #7f1d1d !important; border-color: #991b1b !important; color: #fca5a5 !important; }
      body.dark-mode .badge-role { background: #1e3a8a !important; color: #93c5fd !important; }
