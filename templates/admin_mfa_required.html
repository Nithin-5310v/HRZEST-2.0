<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Two-Factor Authentication Required — HRzest.com</title>
    <link rel="icon" type="image/svg+xml" href="{{ static_url('favicon.svg') }}" />
    <link rel="stylesheet" href="{{ static_url('tabler-icons.min.css') }}" />
    <link rel="stylesheet" href="{{ static_url('shared.min.css') }}" />
    <link rel="stylesheet" href="{{ static_url('landing_v2.css') }}" />
    <style>
      /* Same design system as templates/admin_login.html -- see that file's
         comment. Locked to light theme. */
      * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-body); }
      html, body { min-height: 100vh; color: var(--text-main); }
      body {
        background: linear-gradient(160deg, #FDF3E3 0%, #F7ECF7 28%, #EAF0FC 56%, var(--bg-secondary) 100%);
        background-attachment: fixed;
        display: flex; align-items: center; justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%; max-width: 400px;
        background: var(--bg-card);
        border: 1px solid var(--border-color); border-radius: var(--radius-lg);
        padding: 36px 32px 32px;
        box-shadow: var(--shadow-lg);
        position: relative; overflow: hidden;
        text-align: center;
      }
      .card::before {
        content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
        background: var(--gradient-brand);
      }
      .icon {
        width: 56px; height: 56px; margin: 0 auto 16px;
        background: var(--gradient-brand);
        border-radius: var(--radius-md);
        display: flex; align-items: center; justify-content: center;
        font-size: 24px; color: #fff;
        box-shadow: 0 8px 24px rgba(79, 70, 229, 0.35);
      }
      h1 { font-family: var(--font-heading); font-size: 19px; font-weight: 800; color: var(--text-main); margin-bottom: 10px; }
      p { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 18px; }
      img#mfa-qr { width: 160px; height: 160px; display: block; margin: 0 auto 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); }
      code#mfa-secret {
        display: inline-block; background: var(--bg-secondary); color: var(--text-main);
        padding: 3px 9px; border-radius: 6px; font-size: 11px; margin-bottom: 18px; border: 1px solid var(--border-color);
      }
      input#mfa-code {
        width: 100%; padding: 12px; text-align: center; letter-spacing: 5px;
        font-size: 18px; font-weight: 700; background: var(--bg-secondary); border: 1px solid var(--border-color);
        border-radius: var(--radius-sm); color: var(--text-main); outline: none; margin-bottom: 16px; transition: var(--transition-fast);
      }
      input#mfa-code:focus { border-color: var(--accent-cyan); background: var(--bg-card); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12); }
      button#mfa-submit {
        width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm);
        background: var(--gradient-brand); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
        transition: var(--transition-fast); box-shadow: var(--shadow-md);
      }
      button#mfa-submit:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
      #mfa-err { margin-top: 12px; font-size: 12px; color: var(--accent-rose); display: none; }
      .logout-form { margin: 18px 0 0; }
      .logout-link { display: inline-block; font-size: 12px; color: var(--text-subtle); text-decoration: none;
                     background: none; border: none; padding: 0; font-family: inherit; cursor: pointer; }
      .logout-link:hover { color: var(--text-muted); }
      @media (max-width: 480px) { .card { padding: 32px 24px 28px; } }
    </style>
    <!-- Shared Zoho-style public theme (blue, clean light canvas), loaded last -->
  <link rel="stylesheet" href="{{ static_url('public-theme.css') }}" />
  <!-- 3D motion & depth layer (static/ui-motion.*): loaded in <head>, no defer -->
  <link rel="stylesheet" href="{{ static_url('ui-motion.css') }}" />
  <script src="{{ static_url('ui-motion.js') }}"></script>
</head>
  <body>
    <div class="card">
      <div class="icon"><i class="ti ti-shield-lock"></i></div>
      <h1>Two-Factor Authentication Required</h1>
      <p>Administrative accounts must enroll an authenticator app before continuing.
         Scan the code below, then enter the 6-digit code it shows.</p>
      <img id="mfa-qr" alt="2FA QR code" />
      <div>Can't scan? Enter manually: <code id="mfa-secret"></code></div>
      <input type="text" id="mfa-code" inputmode="numeric" pattern="[0-9]*" maxlength="6"
             placeholder="000000" autocomplete="one-time-code" />
      <button id="mfa-submit" type="button" onclick="mfaSubmit()">Confirm &amp; Continue</button>
      <div id="mfa-err">Invalid code — please try again.</div>
      <form action="{{ tpath('/logout') }}" method="POST" class="logout-form">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />
        <button type="submit" class="logout-link">Log out instead</button>
      </form>
    </div>

    <script>
      var qrEl     = document.getElementById('mfa-qr');
      var secretEl = document.getElementById('mfa-secret');
      var codeEl   = document.getElementById('mfa-code');
      var errEl    = document.getElementById('mfa-err');

      fetch('/api/settings/2fa/setup')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.ok && d.already_enabled) {
            // Enrolled in another tab/session already — nothing left to do here.
            window.location.href = '/admin';
            return;
          }
          if (d.ok) {
            qrEl.src = d.qr_code;
            secretEl.textContent = d.secret;
          }
        })
        .catch(function() {});

      window.mfaSubmit = function() {
        var code = codeEl.value.trim();
        errEl.style.display = 'none';
        fetch('/api/settings/2fa/enable', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code }),
        })
          .then(function(r) { return r.json(); })
          .then(function(d) {
            if (!d.ok) { errEl.textContent = d.msg || 'Invalid code'; errEl.style.display = 'block'; return; }
            window.location.href = '/admin';
          })
          .catch(function() { errEl.textContent = 'Network error.'; errEl.style.display = 'block'; });
      };

      codeEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') mfaSubmit(); });
    </script>
  </body>
</html>
