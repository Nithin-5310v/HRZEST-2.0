---
# Auto-provisions Grafana's Loki datasource on container start, so a fresh
# Grafana instance already has "Loki" ready to query without any manual
# UI setup -- see https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    # Talks to the loki container over the compose network, not the
    # internet-facing side of this host -- see log-server/compose.yml.
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 5000
